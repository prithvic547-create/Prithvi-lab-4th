<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Tournament Management</title>
</head>
<body>

    <h1>Sports Tournament Management System</h1>

    <h2>Welcome to Sports Tournament Management</h2>

    <p>Manage tournaments, teams, players and matches easily.</p>

    <h3>Available Sports</h3>

    <ul>
        <li>Cricket</li>
        <li>Football</li>
        <li>Badminton</li>
        <li>Basketball</li>
    </ul>

    <h3>Tournament Registration</h3>

    <form>
        <label>Team Name:</label>
        <input type="text" placeholder="Enter team name">

        <br><br>

        <label>Sport:</label>
        <select>
            <option>Cricket</option>
            <option>Football</option>
            <option>Badminton</option>
            <option>Basketball</option>
        </select>

        <br><br>

        <button type="submit">Register Team</button>
    </form>

</body>
</html>
